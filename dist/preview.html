<style>
/* 주식 투자 바이블 — 디자인 토큰
   레이아웃: 데스크톱은 왼쪽 목차(장부 색인) + 본문 한 단, 모바일은 상단 검색 + 하단 탭.
   색: 남색 잉크 + 놋쇠색 강조. 상승·하락 색은 시장 관례(한국: 빨강↑ 파랑↓, 미국: 초록↑ 빨강↓)를 따르고,
   모양(속 빈 봉/채운 봉, ▲/▼ 기호)으로도 구분한다. */
:root {
  --bg: #eef1f0;
  --surface: #fbfcfc;
  --surface-2: #e4e9e8;
  --ink: #16222c;
  --muted: #55646d;
  --line: #cfd8d8;
  --accent: #8a5a00;
  --accent-soft: #f3e6c8;
  --focus: #b07a10;
  --kr-up: #c42d2a;  --kr-down: #1f55c0;
  --us-up: #1a7f45;  --us-down: #c42d2a;
  --neutral-candle: #4a5a64;
  --ok: #1a7a45; --warn: #9a6200; --bad: #b3261e;
  --synthetic: #8a5a00;
  --hatch: rgba(138, 90, 0, .16);
  --bar-bg: #16222c; --bar-fg: #eef1f0; --bar-accent: #e2b45c;
  --mask: rgba(22, 34, 44, .06);
  --font-display: "Hahmlet", "Noto Serif KR", "AppleMyungjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  --step--1: .82rem; --step-0: 1rem; --step-1: 1.15rem; --step-2: 1.4rem; --step-3: 1.85rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171d; --surface: #172129; --surface-2: #1e2a33; --ink: #e6ecee; --muted: #9aabb4; --line: #2c3a44;
    --accent: #e2b45c; --accent-soft: #3a2f17; --focus: #e2b45c;
    --kr-up: #ff6b63; --kr-down: #6b9dff; --us-up: #4cc985; --us-down: #ff6b63; --neutral-candle: #a8b6be;
    --ok: #4cc985; --warn: #e2b45c; --bad: #ff7a70; --synthetic: #e2b45c; --hatch: rgba(226,180,92,.14); --mask: rgba(230,236,238,.05);
    --bar-bg: #0a1015; --bar-fg: #e6ecee; --bar-accent: #e2b45c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171d; --surface: #172129; --surface-2: #1e2a33; --ink: #e6ecee; --muted: #9aabb4; --line: #2c3a44;
  --accent: #e2b45c; --accent-soft: #3a2f17; --focus: #e2b45c;
  --kr-up: #ff6b63; --kr-down: #6b9dff; --us-up: #4cc985; --us-down: #ff6b63; --neutral-candle: #a8b6be;
  --ok: #4cc985; --warn: #e2b45c; --bad: #ff7a70; --synthetic: #e2b45c; --hatch: rgba(226,180,92,.14); --mask: rgba(230,236,238,.05);
  --bar-bg: #0a1015; --bar-fg: #e6ecee; --bar-accent: #e2b45c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.65; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.3; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-3); font-weight: 700; }
h2 { font-size: var(--step-2); font-weight: 700; }
h3 { font-size: var(--step-1); font-weight: 500; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: var(--bg); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 8px; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- 셸 ---------- */
.shell { min-height: 100%; display: grid; grid-template-columns: 1fr; grid-template-areas: "top" "main"; }
.topbar { grid-area: top; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar-bg); color: var(--bar-fg); }
.topbar-in { display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
.brand-mark { width: 22px; height: 22px; border: 2px solid var(--bar-accent); border-radius: 3px; position: relative; flex: none; }
.brand-mark::before, .brand-mark::after { content: ""; position: absolute; left: 50%; width: 2px; background: var(--bar-accent); }
.brand-mark::before { top: 3px; height: 13px; transform: translateX(-4px); }
.brand-mark::after { top: 6px; height: 8px; transform: translateX(2px); }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: .01em; }
.search { flex: 1; min-width: 0; }
.search input { width: 100%; border: 1px solid transparent; background: rgba(255,255,255,.1); color: inherit; border-radius: 8px; padding: 8px 12px; font-size: .95rem; }
.search input::placeholder { color: inherit; opacity: .65; }
.search input:focus { background: rgba(255,255,255,.16); border-color: var(--bar-accent); outline: none; }
.icon-btn { flex: none; background: transparent; border: 1px solid rgba(255,255,255,.3); color: inherit; border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: .9rem; }
.icon-btn[aria-expanded="true"] { background: var(--bar-accent); color: var(--bar-bg); border-color: var(--bar-accent); }
.prefbar { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: var(--step--1); }
.prefbar button { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); color: inherit; border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.prefbar b { font-weight: 600; color: var(--bar-accent); }
.prefs-panel { background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--line); padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-height: 70vh; overflow: auto; }

.sidenav { display: none; }
main { grid-area: main; min-width: 0; padding-block: 20px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; }
.page { max-width: 820px; margin: 0 auto; display: grid; gap: 20px; }
.page > * { min-width: 0; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 8px 2px 7px; text-decoration: none; font-size: .72rem; color: var(--muted); }
.tabbar a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tabbar a[aria-current="page"] .ti { border-color: var(--accent); background: var(--accent-soft); }
.ti { width: 26px; height: 22px; border: 1.5px solid currentColor; border-radius: 6px; position: relative; }
.ti::after { content: ""; position: absolute; inset: 0; margin: auto; }
.ti-home::after { width: 8px; height: 6px; border: 1.5px solid currentColor; border-bottom: 0; top: 4px; }
.ti-book::after { width: 1.5px; height: 12px; background: currentColor; }
.ti-chart::after { width: 3px; height: 10px; border: 1.5px solid currentColor; box-shadow: 6px -2px 0 -0px currentColor; }
.ti-target::after { width: 8px; height: 8px; border: 1.5px solid currentColor; border-radius: 50%; }
.ti-more::after { width: 3px; height: 3px; border-radius: 50%; background: currentColor; box-shadow: -6px 0 0 currentColor, 6px 0 0 currentColor; }

@media (min-width: 960px) {
  .shell { grid-template-columns: 230px 1fr; grid-template-areas: "top top" "side main"; }
  .sidenav { grid-area: side; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 108px; align-self: start; padding: 20px 12px 20px max(16px, env(safe-area-inset-left, 0px)); }
  .sidenav a { text-decoration: none; padding: 7px 12px; border-radius: 8px; color: var(--muted); font-size: .95rem; }
  .sidenav a:hover { background: var(--surface-2); color: var(--ink); }
  .sidenav a[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
  .sidenav small { font-size: .7rem; color: var(--muted); margin-left: 4px; }
  .tabbar { display: none; }
  main { padding-bottom: 60px; }
}

/* ---------- 공통 구성 요소 ---------- */
.eyebrow { font-size: var(--step--1); letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.lead { font-size: 1.05rem; color: var(--muted); max-width: 65ch; }
.prose { max-width: 68ch; display: grid; gap: 10px; }
.prose ul, .prose ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel h3 { font-size: 1.05rem; }
.section { display: grid; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid-2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.grid-3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.section > *, .panel > *, .stack > *, .grid-2 > *, .grid-3 > *, .compare > *, .compare-charts > * { min-width: 0; }
.stack { display: grid; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
hr.rule { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; text-decoration: none; font-size: .95rem; min-height: 40px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.accent { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: .85rem; }

.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: .78rem; color: var(--muted); background: var(--surface); white-space: nowrap; }
.chip.lv1::before, .chip.lv2::before, .chip.lv3::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid currentColor; }
.chip.lv2::before { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.chip.lv3::before { background: currentColor; }
.chip.draft { border-style: dashed; color: var(--warn); border-color: var(--warn); }
.chip.reviewed { color: var(--ok); border-color: var(--ok); }
.chip.synthetic { color: var(--synthetic); border-color: var(--synthetic); background: repeating-linear-gradient(-45deg, var(--hatch) 0 4px, transparent 4px 8px); font-weight: 600; }
.chip.real { color: var(--ok); border-color: var(--ok); font-weight: 600; }
.chip.unverified { border-style: dashed; color: var(--muted); font-weight: 600; }
.chip.offline { border-style: dotted; color: var(--bad); border-color: var(--bad); font-weight: 600; }
.chip.match { color: var(--accent); border-color: var(--accent); }

.seg { display: flex; flex-wrap: wrap; gap: 6px; position: relative; }
.seg input { position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none; }
.seg label { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; background: var(--surface); font-size: .92rem; display: grid; gap: 0; }
.seg label small { color: var(--muted); font-size: .74rem; }
.seg input:checked + label { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--accent-soft); }
.seg input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
.field { display: grid; gap: 4px; }
.field label, .field .lbl { font-weight: 600; font-size: .9rem; }
.field input, .field textarea, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; width: 100%; }
.field textarea { min-height: 70px; resize: vertical; }
.field .hint { font-size: var(--step--1); color: var(--muted); }

.notice { border: 1px solid var(--line); border-left: 4px solid var(--muted); background: var(--surface); padding: 10px 14px; border-radius: 8px; font-size: .92rem; display: grid; gap: 4px; }
.notice.warn { border-left-color: var(--warn); }
.notice.bad { border-left-color: var(--bad); }
.notice.ok { border-left-color: var(--ok); }
.notice.synthetic { border-left-color: var(--synthetic); background: repeating-linear-gradient(-45deg, var(--hatch) 0 6px, transparent 6px 14px), var(--surface); }

details.more { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.more > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "펼치기"; font-weight: 400; color: var(--muted); font-size: .85rem; }
details.more[open] > summary::after { content: "접기"; }
details.more > div { padding: 0 14px 14px; display: grid; gap: 8px; }

/* 목록 */
.list { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.list-item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border-top: 1px solid var(--line); text-decoration: none; align-items: start; }
.list-item:first-child { border-top: 0; }

.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 10px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }

/* 홈 */

.hero h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); }
.setup { display: grid; gap: 14px; }
.setup fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
.setup legend { font-weight: 600; padding: 0; margin-bottom: 4px; }
.tile { display: grid; gap: 4px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-decoration: none; }
.tile:hover { border-color: var(--muted); }
.tile .k { font-weight: 600; }
.tile .v { color: var(--muted); font-size: .9rem; }

.chart { display: grid; gap: 6px; min-width: 0; }

  .page { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }

<script>window.SB_NO_SW = true;</script>
<script>
/* js/core/util.js */
/* 공통 도우미 함수 — 화면 코드에서 반복되는 작업을 모아둔 파일 */
window.SB = window.SB || {};
(function (SB) {
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  const LEVELS = { 1: '초급', 2: '중급', 3: '고급' };
  const MARKETS = { ALL: '한국·미국', KR: '한국', US: '미국' };
  const HORIZONS = {
    day: { name: '당일', hint: '하루 안에 사고팖' },
    swing: { name: '며칠~몇 주', hint: '단기 추세' },
    months: { name: '수개월', hint: '중기 추세·실적' },
    year: { name: '1년 이상', hint: '기업 가치·분산' },
  };
  const TIMEFRAMES = {
    m: { name: '분봉', short: '분', supported: false },
    D: { name: '일봉', short: '일', supported: true },
    W: { name: '주봉', short: '주', supported: true },
    M: { name: '월봉', short: '월', supported: true },
  };
  /* 학습용 안내: 투자 기간별로 흔히 함께 보는 봉 주기 (규칙이 아니라 출발점) */
  const HORIZON_TF = { day: ['m'], swing: ['D'], months: ['D', 'W'], year: ['W', 'M'] };

  const fmt = {
    n(v, d = 0) { if (v == null || !isFinite(v)) return '—'; return Number(v).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d }); },
    pct(v, d = 1) { if (v == null || !isFinite(v)) return '—'; return (v * 100).toFixed(d) + '%'; },
    spct(v, d = 1) { if (v == null || !isFinite(v)) return '—'; const s = (v * 100).toFixed(d); return (v > 0 ? '+' : '') + s + '%'; },
    date(ts) { try { return new Date(ts).toLocaleDateString('ko-KR'); } catch (e) { return ''; } },
  };

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
  }

  /* 검색용 정규화: 공백·대소문자·하이픈 무시 */
  function norm(s) { return String(s || '').toLowerCase().replace(/[\s\-·_./()]/g, ''); }

  SB.u = { esc, $, $$, fmt, toast, norm, LEVELS, MARKETS, HORIZONS, TIMEFRAMES, HORIZON_TF };
})(window.SB);

/* js/core/store.js */
/* 기기 내 저장소 (localStorage)
   - 학습 설정, 북마크, 학습 기록, 퀴즈 결과, 연습실 기록을 이 브라우저에만 저장한다.
   - 여러 기기 동기화는 아직 없다. 백업 파일 내보내기·가져오기로 옮길 수 있다.
   - 저장이 막힌 환경(사생활 보호 창 등)에서는 메모리에만 두고 화면에 알린다. */
(function (SB) {
  const KEY = 'sb:v1';
  const SCHEMA = 1;
  const defaults = () => ({
    schema: SCHEMA,
    prefs: { level: 1, market: 'ALL', horizon: 'swing', tf: 'D', annot: true },
    bookmarks: {},   // "term:per" -> 저장 시각
    viewed: {},      // "term:per" -> 마지막 열람 시각
    quiz: {},        // 문제 id -> { ok, tries, ts }
    practice: [],    // 연습실 기록
    last: null,      // { route, title, ts } 이어서 공부하기
  });

  let data = defaults();
  let persistent = true;
  const listeners = new Set();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        const d = defaults();
        data = Object.assign(d, parsed, { prefs: Object.assign(d.prefs, parsed.prefs || {}) });
      }
      localStorage.setItem(KEY + ':probe', '1');
      localStorage.removeItem(KEY + ':probe');
    } catch (e) {
      persistent = false;
    }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); persistent = true; }
    catch (e) { persistent = false; }
    listeners.forEach((fn) => { try { fn(data); } catch (e) { /* 무시 */ } });
  }

  const store = {
    get data() { return data; },
    get prefs() { return data.prefs; },
    get persistent() { return persistent; },
    on(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    setPref(k, v) { data.prefs[k] = v; save(); },
    key(type, id) { return type + ':' + id; },
    isBookmarked(type, id) { return !!data.bookmarks[type + ':' + id]; },
    toggleBookmark(type, id) {
      const k = type + ':' + id;
      if (data.bookmarks[k]) delete data.bookmarks[k]; else data.bookmarks[k] = Date.now();
      save();
      return !!data.bookmarks[k];
    },
    markViewed(type, id) { data.viewed[type + ':' + id] = Date.now(); save(); },
    isViewed(type, id) { return !!data.viewed[type + ':' + id]; },
    recordQuiz(qid, ok) {
      const prev = data.quiz[qid] || { tries: 0 };
      data.quiz[qid] = { ok, tries: prev.tries + 1, ts: Date.now(), everWrong: prev.everWrong || !ok };
      save();
    },
    addPractice(rec) { data.practice.unshift(rec); data.practice = data.practice.slice(0, 200); save(); },
    setLast(route, title) { data.last = { route, title, ts: Date.now() }; save(); },
    exportJSON() { return JSON.stringify(Object.assign({ exportedAt: new Date().toISOString(), app: '주식 투자 바이블' }, data), null, 2); },
    importJSON(text) {
      const parsed = JSON.parse(text);
      if (!parsed || typeof parsed !== 'object' || !parsed.prefs) throw new Error('주식 투자 바이블 백업 파일이 아닙니다.');
      const d = defaults();
      data = Object.assign(d, parsed, { prefs: Object.assign(d.prefs, parsed.prefs) });
      delete data.exportedAt; delete data.app;
      save();
    },
    reset() { data = defaults(); save(); },
  };
  load();
  SB.store = store;
})(window.SB);

/* js/core/rng.js */
/* 재현 가능한 난수 — 같은 seed면 항상 같은 가상 차트가 나온다 */
(function (SB) {
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rng(seed) {
    const r = mulberry32(seed);
    let spare = null;
    return {
      next: r,
      gauss() {
        if (spare != null) { const s = spare; spare = null; return s; }
        let u = 0, v = 0;
        while (u === 0) u = r();
        while (v === 0) v = r();
        const m = Math.sqrt(-2 * Math.log(u));
        spare = m * Math.sin(2 * Math.PI * v);
        return m * Math.cos(2 * Math.PI * v);
      },
      int(n) { return Math.floor(r() * n); },
    };
  }
  function hashSeed(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  SB.rng = rng;
  SB.hashSeed = hashSeed;
})(window.SB);

/* js/core/synth.js */
/* 설명용 가상 데이터(합성 차트) 생성기
   - 실제 시장 가격이 아니다. 모양을 설명하기 위해 직접 만든 데이터다.
   - 이 데이터로 계산한 결과는 실제 시장의 성과 통계로 쓰지 않는다.
   - anchors: [[봉 번호, 기준 대비 수준(%)], ...] 를 이어 기본 경로를 만들고, seed로 재현 가능한 잡음을 더한다. */
(function (SB) {
  const MARKET_BASE = {
    KR: { base: 20000, currency: '가상 원', unit: '원', decimals: 0, tick: 10, volBase: 400000 },
    US: { base: 50, currency: '가상 달러', unit: '$', decimals: 2, tick: 0.01, volBase: 1800000 },
    ALL: { base: 100, currency: '가격 지수 (시작=100)', unit: 'pt', decimals: 2, tick: 0.01, volBase: 1000000 },
  };
  /* 봉 주기에 따른 가상 데이터의 성질: 길수록 한 봉의 변동 폭(amp)은 크고, 모양 대비 잡음(noise)은 작게 */
  const TF_SHAPE = {
    m: { amp: 0.3, noise: 1.35 },
    D: { amp: 1.0, noise: 0.9 },
    W: { amp: 1.7, noise: 0.7 },
    M: { amp: 2.6, noise: 0.55 },
  };

  function interp(anchors, i) {
    if (i <= anchors[0][0]) return anchors[0][1];
    for (let k = 1; k < anchors.length; k++) {
      const [x1, y1] = anchors[k];
      const [x0, y0] = anchors[k - 1];
      if (i <= x1) {
        const t = (i - x0) / (x1 - x0 || 1);
        const s = t * t * (3 - 2 * t) * 0.35 + t * 0.65; // 약간 부드러운 보간
        return y0 + (y1 - y0) * s;
      }
    }
    return anchors[anchors.length - 1][1];
  }

  function spikeAt(spikes, i) {
    let m = 1;
    (spikes || []).forEach((s) => {
      if (s.length === 2 && s[0] === i) m *= s[1];
      if (s.length === 3 && i >= s[0] && i <= s[1]) m *= s[2];
    });
    return m;
  }

  function roundTo(v, tick) { return Math.round(v / tick) * tick; }

  /* 패턴 설명용 시계열 */
  function series(opt) {
    const market = opt.market && MARKET_BASE[opt.market] ? opt.market : 'ALL';
    const mb = MARKET_BASE[market];
    const tf = TF_SHAPE[opt.tf] ? opt.tf : 'D';
    const shape = TF_SHAPE[tf];
    const r = SB.rng(opt.seed || 1);
    const n = opt.n || (opt.anchors[opt.anchors.length - 1][0] + 1);
    const noise = (opt.noise != null ? opt.noise : 1) * shape.noise;
    const toPrice = (lv) => mb.base * Math.max(0.05, 1 + (shape.amp * lv) / 100);
    const bars = [];
    let prevC = interp(opt.anchors, 0);
    let dev = 0;
    for (let i = 0; i < n; i++) {
      const p = interp(opt.anchors, i);
      dev = dev * 0.35 + r.gauss() * noise * 0.75;
      let c = p + dev;
      let o = i === 0 ? p - r.gauss() * noise * 0.4 : prevC + r.gauss() * noise * 0.3;
      let h = Math.max(o, c) + Math.abs(r.gauss()) * noise * 0.55;
      let l = Math.min(o, c) - Math.abs(r.gauss()) * noise * 0.55;
      const ov = opt.overrides && opt.overrides[i];
      if (ov) {
        if (ov.o != null) o = ov.o; if (ov.c != null) c = ov.c;
        h = ov.h != null ? ov.h : Math.max(o, c, h); l = ov.l != null ? ov.l : Math.min(o, c, l);
        h = Math.max(h, o, c); l = Math.min(l, o, c);
        dev = c - p;
      }
      const move = Math.abs(c - prevC) / (noise || 1);
      const v = mb.volBase * (0.65 + r.next() * 0.6) * (1 + 0.25 * Math.min(move, 3)) * spikeAt(opt.volume, i);
      bars.push({ i, o: toPrice(o), h: toPrice(h), l: toPrice(l), c: toPrice(c), v: Math.round(v) });
      prevC = c;
    }
    bars.forEach((b) => { ['o', 'h', 'l', 'c'].forEach((k) => { b[k] = roundTo(b[k], mb.tick); }); });
    return {
      bars,
      toPrice: (lv) => roundTo(toPrice(lv), mb.tick),
      meta: {
        synthetic: true, market, currency: mb.currency, unit: mb.unit, decimals: mb.decimals,
        tf, seed: opt.seed, source: '직접 생성한 합성 데이터', asOf: '해당 없음(가상)',
      },
    };
  }

  /* 무작위 보행 시계열 — 통계 엔진 시연, 무작위 연습 문제용

          const slotPx = rect.width * (VW - PAD_L - PAD_R) / VW / (dragStart.e - dragStart.s);

        }
      }
    });
    function endPointer(ev) {
      const wasMoved = moved;
      pointers.delete(ev.pointerId);
      if (pointers.size < 2) pinchStart = null;
      if (pointers.size === 0) {
        box.classList.remove('grabbing');
        if (!wasMoved && dragStart && ev.type === 'pointerup') showInfo(idxFromClient(ev.clientX));

      }

    box.addEventListener('pointerup', endPointer);
    box.addEventListener('pointercancel', endPointer);
    box.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') endPointer(ev); });

    draw();

/* 재현 가능한 수익·손실 통계 계산 엔진
   - AI가 확률을 만들지 않는다. 같은 데이터와 같은 규칙이면 언제나 같은 숫자가 나온다.
   - 신호 판정 함수에는 그 시점까지의 봉만 넘긴다 (미래 정보 사용 방지).
   - 진입은 신호 다음 봉 시가, 비용은 왕복 비율로 차감.
   - 같은 봉에서 목표가·손절가를 모두 지나간 경우의 처리 규칙(sameBarRule)을 결과에 함께 기록.
   - 한 종목에서 보유 중에는 새 진입을 하지 않는다 (중첩 사례 방지).
   - 불확실성 범위는 종목 단위로 다시 뽑는 부트스트랩(같은 종목 사례끼리의 의존성 반영). */
(function (SB) {
  const DEFAULTS = {
    warmup: 20, hold: 10, target: 0.08, stop: 0.04, dd: 0.05, cost: 0.003,
    sameBarRule: 'stop-first', split: 0.6, nonOverlap: true,
  };

  function run(seriesList, signal, cfgIn) {
    const cfg = Object.assign({}, DEFAULTS, cfgIn || {});
    const trades = [];
    let skippedEnd = 0;
    seriesList.forEach((s) => {
      const b = s.bars;
      const splitIdx = Math.floor((cfg.totalLen || b.length) * cfg.split);
      let nextAllowed = 0;
      for (let i = cfg.warmup; i < b.length - 1; i++) {
        if (cfg.nonOverlap && i < nextAllowed) continue;
        const past = b.slice(0, i + 1); // 이 시점까지만
        if (!signal(past, i)) continue;
        const entryIdx = i + 1;
        const entry = b[entryIdx].o;
        let exitIdx = entryIdx + cfg.hold - 1;
        let delistExit = false;
        if (exitIdx > b.length - 1) {
          if (s.delisted) { exitIdx = b.length - 1; delistExit = true; } // 상장폐지: 마지막 가격으로 청산 처리
          else { skippedEnd++; continue; } // 데이터 끝: 결과를 알 수 없어 제외
        }
        const fixedRet = b[exitIdx].c / entry - 1 - cfg.cost;
        const tgt = entry * (1 + cfg.target), stp = entry * (1 - cfg.stop), ddLv = entry * (1 - cfg.dd);
        let ddHit = false, race = 'none', sameBar = false, raceIdx = null;
        for (let k = entryIdx; k <= exitIdx; k++) {
          if (b[k].l <= ddLv) ddHit = true;
          if (race === 'none') {
            const hT = b[k].h >= tgt, hS = b[k].l <= stp;
            if (hT && hS) {
              sameBar = true; raceIdx = k;
              race = cfg.sameBarRule === 'target-first' ? 'target' : cfg.sameBarRule === 'exclude' ? 'excluded' : 'stop';
            } else if (hT) { race = 'target'; raceIdx = k; }
            else if (hS) { race = 'stop'; raceIdx = k; }
          }
        }
        trades.push({
          sid: s.id, entryIdx, exitIdx, entry, fixedRet, ddHit, race, raceIdx, sameBar, delistExit,
          period: entryIdx < splitIdx ? 'dev' : 'test',
        });
        nextAllowed = exitIdx + 1;
      }
    });
    return { trades, skippedEnd, cfg };
  }

  function median(a) {
    if (!a.length) return null;
    const s = a.slice().sort((x, y) => x - y);
    const m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  const mean = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

  function summarize(trades) {
    const n = trades.length;
    if (!n) return { n: 0 };
    const r = trades.map((t) => t.fixedRet);
    const wins = r.filter((x) => x > 0), losses = r.filter((x) => x < 0);
    const decided = trades.filter((t) => t.race === 'target' || t.race === 'stop');
    // 연속 실행 최대낙폭: 진입 순서대로 매번 전액 투입한다고 가정한 누적 자산 곡선
    const seq = trades.slice().sort((a, b) => a.entryIdx - b.entryIdx || String(a.sid).localeCompare(String(b.sid)));
    let eq = 1, peak = 1, mdd = 0;
    seq.forEach((t) => { eq *= 1 + t.fixedRet; peak = Math.max(peak, eq); mdd = Math.min(mdd, eq / peak - 1); });
    return {
      n,
      posRatio: wins.length / n,
      negRatio: losses.length / n,
      mean: mean(r), median: median(r),
      avgWin: mean(wins), avgLoss: mean(losses),
      ddHitRatio: trades.filter((t) => t.ddHit).length / n,
      stopFirstRatio: decided.length ? decided.filter((t) => t.race === 'stop').length / decided.length : null,
      decided: decided.length,
      undecided: trades.filter((t) => t.race === 'none').length,
      sameBar: trades.filter((t) => t.sameBar).length,
      mdd,
      finalEquity: eq,
    };
  }

  /* 종목 단위 부트스트랩: 종목을 복원추출해 같은 종목의 사례를 함께 묶는다 */
  function bootstrap(trades, key, B, seed) {
    const bySid = new Map();
    trades.forEach((t) => { if (!bySid.has(t.sid)) bySid.set(t.sid, []); bySid.get(t.sid).push(t); });
    const groups = Array.from(bySid.values());
    if (groups.length < 5) return null;
    const r = SB.rng(seed || 99);
    const vals = [];
    for (let k = 0; k < (B || 400); k++) {
      const pick = [];
      for (let g = 0; g < groups.length; g++) pick.push.apply(pick, groups[r.int(groups.length)]);
      const s = summarize(pick);
      if (s[key] != null) vals.push(s[key]);
    }
    vals.sort((a, b) => a - b);
    return { lo: vals[Math.floor(vals.length * 0.025)], hi: vals[Math.floor(vals.length * 0.975) - 1] };
  }

  /* 예시 신호: 직전 lookback봉 최고가를 종가로 넘어서면 신호 */
  function breakoutSignal(lookback) {
    return function (past) {
      const i = past.length - 1;
      if (i < lookback) return false;
      let hi = -Infinity;
      for (let k = i - lookback; k < i; k++) hi = Math.max(hi, past[k].h);
      return past[i].c > hi;
    };
  }
  /* 비교 기준: 같은 종목·같은 기간에서 조건 없이 hold봉마다 진입 */
  function periodicSignal(every) { return (past) => (past.length - 1) % every === 0; }

  SB.stats = { run, summarize, bootstrap, breakoutSignal, periodicSignal, DEFAULTS, median, mean };
})(window.SB);

      myth: ['추세는 계속된다 — 추세는 끝나기 전까지만 추세다.'],
      limit: '횡보 구간에서는 추세 판단이 자주 뒤집힌다.',
      rel: ['support', 'resistance', 'ma', 'lookahead'], src: ['textbook'],
      q: { q: '상승 추세가 훼손되었다고 보는 첫 신호로 적절한 것은?', o: ['고점 갱신', '직전 저점 아래로 하락', '거래량 증가', '양봉 출현'], a: 1, why: '저점이 낮아지면 "저점이 높아진다"는 상승 추세 조건이 깨진다.' } }),

    T({ id: 'support', ko: '지지선', en: 'Support', cat: 'chart', lv: 2, hz: ['swing', 'months'],
      def: '과거에 여러 번 하락이 멈췄던 가격대로, 매수가 다시 들어올 수 있다고 보는 구간이다.',

    T({ id: 'resistance', ko: '저항선', en: 'Resistance', cat: 'chart', lv: 2, hz: ['swing', 'months'],
      def: '과거에 여러 번 상승이 멈췄던 가격대로, 매도가 다시 나올 수 있다고 보는 구간이다.',
      easy: '12,000원 근처에서 번번이 밀렸다면 그곳이 저항이다. 이 가격에 산 사람들이 본전에 팔려는 물량이 나온다는 해석이 흔하다.',
      ex: '고점 11,980 · 12,050 · 12,010 → 저항 구간 약 11,980~12,050.',
      check: '같은 가격대에서 밀린 횟수, 그 구간에서의 거래량을 본다.',
      mid: '저항을 거래량을 동반해 돌파하면 이후 지지로 바뀌는지 되돌림에서 확인한다.',
      adv: '둥근 숫자(10,000원, 100달러)에서 저항처럼 보이는 현상은 확인편향의 대상이 되기 쉽다. 비교 기준(아무 가격대) 대비 반응 빈도를 계산해야 의미를 말할 수 있다.',
      myth: ['저항선 근처에서는 팔아야 한다 — 돌파될 수도 있다.'],
      limit: '저항의 강도를 숫자로 말하려면 검증이 필요하다.',
      rel: ['support', 'breakout', 'false-breakout'], src: ['textbook'],
      q: { q: '저항선을 돌파한 뒤 되돌림이 그 가격대에서 멈췄다. 흔한 해석은?', o: ['저항이 지지로 바뀌었는지 확인하는 장면', '무조건 매도', '추세 종료', '거래 정지'], a: 0, why: '역할 전환 여부를 되돌림에서 확인한다. 확정은 아니다.' } }),

    T({ id: 'breakout', ko: '돌파', en: 'Breakout', cat: 'chart', lv: 2, hz: ['swing', 'months'],
      def: '가격이 저항(또는 지지) 구간을 미리 정한 기준 이상으로 넘어서는 것이다.',
      easy: '"종가가 저항선보다 2% 위에서 마감"처럼 기준을 정해야 돌파인지 아닌지 다툼이 없다.',
      ex: '저항 12,000원, 기준 +2% → 종가 12,240원 이상이면 돌파로 판정.',
      check: '돌파 봉의 거래량이 최근 평균 대비 얼마나 늘었는지, 다음 몇 봉 동안 돌파 가격 위에 머무는지 확인한다.',
      mid: '장중에 넘었다가 종가로 되돌아오는 경우가 많아 종가 기준 판정을 흔히 쓴다.',
      adv: '돌파 기준(%·봉 수·거래량 배수)을 여러 개 시험해 가장 좋은 것을 고르면 과최적화가 된다. 기준은 개발 기간에 정하고 검증 기간에 고정해 확인한다.',
      myth: ['돌파하면 오른다 — 거짓 돌파가 흔하다.'],
      limit: '돌파 직후 진입은 손절 폭이 넓어지기 쉽다.',
      rel: ['false-breakout', 'resistance', 'volume', 'overfitting'], src: ['textbook'],
      q: { q: '돌파 판정 기준을 미리 정하는 이유는?', o: ['보기 좋아서', '사후 해석과 과최적화를 막고 일관되게 판단하려고', '거래량을 줄이려고', '수수료 때문에'], a: 1, why: '정해진 규칙이 있어야 검증과 반복이 가능하다.' } }),

    T({ id: 'false-breakout', ko: '거짓 돌파', en: 'False Breakout', cat: 'chart', lv: 2, hz: ['day', 'swing'],
      def: '돌파 기준을 넘었다가 짧은 기간 안에 다시 원래 구간 안으로 되돌아오는 움직임이다.',
      easy: '저항 위로 올라섰다가 이틀 만에 다시 저항 아래로 내려오면, 돌파를 보고 산 사람들이 손실 매도를 하며 하락이 커질 수 있다.',
      ex: '저항 12,000원, 돌파 종가 12,250원 → 2봉 뒤 종가 11,850원으로 복귀 = 거짓 돌파.',
      check: '돌파 봉의 거래량이 평소와 비슷하거나 줄었는지, 윗꼬리가 길었는지, 시장 전체가 약했는지 확인한다.',
      mid: '"몇 봉 안에 되돌아오면 거짓 돌파"라는 기준을 미리 정한다. 이 기준이 곧 돌파 진입의 무효화 조건이다.',
      adv: '거짓 돌파의 비율은 시장·기간·판정 규칙에 따라 크게 다르다. 확인되지 않은 비율을 일반화하지 않는다.',
      myth: ['거래량만 많으면 진짜 돌파다 — 거래량이 많은 거짓 돌파도 있다.'],
      limit: '되돌아온 뒤 다시 돌파하는 경우도 있다.',
      rel: ['breakout', 'stop-loss', 'support'], src: ['textbook'],
      q: { q: '돌파 매수 직후 가격이 돌파 기준 아래로 되돌아왔다. 미리 정했어야 하는 것은?', o: ['추가 매수 금액', '판단을 무효로 볼 조건과 손절 기준', '목표 수익률만', '아무것도 없다'], a: 1, why: '무효화 조건이 있어야 손실을 제한할 수 있다.' } }),

    T({ id: 'gap', ko: '갭', en: 'Gap', cat: 'chart', lv: 2, hz: ['day', 'swing'],
      def: '전 봉의 가격 범위와 다음 봉의 가격 범위 사이에 거래가 없었던 빈 구간이다.',
      easy: '어제 고가가 10,000원인데 오늘 시가가 10,500원이면 그 사이 500원 구간이 비어 있다. 장 마감 후 뉴스나 실적 발표가 흔한 원인이다.',

      mid: '손절가를 정해도 갭으로 그 아래에서 시작하면 손절가보다 더 큰 손실이 난다. 위험 계산에 갭 위험을 포함한다.',

      kr: '한국은 가격제한폭 때문에 하루 갭에도 한도가 있다.', us: '미국은 가격제한폭이 없어 실적 발표 후 큰 갭이 생길 수 있다.',
      rel: ['stop-loss', 'adjusted-price', 'trading-hours'], src: ['textbook'],
      q: { q: '손절가 9,500원을 정했는데 다음 날 시가가 9,000원으로 시작했다. 맞는 설명은?', o: ['9,500원에 팔렸다', '갭 때문에 9,500원보다 낮은 가격에 체결될 수 있다', '자동으로 거래 취소', '손실이 없다'], a: 1, why: '손절 주문은 가격을 보장하지 않는다. 갭 위험이다.' } }),

    // ───────── 지표 ─────────
    T({ id: 'ma', ko: '이동평균선', en: 'Moving Average', abbr: 'MA', cat: 'indicator', lv: 2,
      def: '최근 N개 봉 종가의 평균을 이어 그린 선으로, 가격 흐름을 매끄럽게 보여준다.',
      easy: '20일 이동평균은 최근 20일 종가 평균이다. 가격이 이 선 위에 오래 머물면 상승 흐름으로 본다. 짧은 평균이 긴 평균을 위로 넘는 것을 골든크로스, 아래로 넘는 것을 데드크로스라고 부른다.',
      ex: '최근 5일 종가 100, 102, 101, 104, 103 → 5일 이동평균 = 510 ÷ 5 = 102.',
      f: '단순이동평균(SMA) = (최근 N개 종가 합) ÷ N', unit: '가격과 같은 단위',
      check: '차트 설정에서 이동평균 기간(5·20·60·120 등)을 확인하고, 가격과의 거리와 기울기를 본다.',
      mid: '이동평균은 과거 가격의 평균이라 늦게 반응한다(후행 지표). 교차 신호는 횡보장에서 잦은 헛신호를 낸다.',
      adv: '이동평균 기간을 여러 개 시험해 가장 좋은 조합을 고르는 것은 과최적화의 전형이다. 검증 기간에서 다시 확인해야 한다.',
      myth: ['골든크로스는 매수 신호다 — 단독으로는 검증되지 않았고 늦은 신호인 경우가 많다.'],
      limit: '종가만 반영하고 거래량·장중 범위는 반영하지 않는다.',
      rel: ['trend', 'macd', 'bollinger', 'overfitting'], src: ['investor'],
      q: { q: '최근 4일 종가 10, 12, 11, 13의 4일 단순이동평균은?', o: ['11', '11.5', '12', '13'], a: 1, why: '(10+12+11+13) ÷ 4 = 11.5.' } }),

    T({ id: 'rsi', ko: 'RSI (상대강도지수)', en: 'Relative Strength Index', abbr: 'RSI', cat: 'indicator', lv: 2, hz: ['swing', 'months'],
      def: '일정 기간 상승폭과 하락폭의 비율로 최근 가격 움직임의 강도를 0~100 사이 숫자로 나타낸 지표다.',
      easy: '최근 14개 봉 중 오른 폭이 대부분이면 RSI가 70 이상으로 높아진다. 흔히 70 이상을 과매수, 30 이하를 과매도라고 부르지만 "곧 반대로 간다"는 뜻은 아니다.',
      ex: '14봉 평균 상승폭 2.0, 평균 하락폭 1.0 → RS = 2 → RSI = 100 − 100 ÷ (1 + 2) ≈ 66.7.',
      f: 'RSI = 100 − 100 ÷ (1 + RS),  RS = 평균 상승폭 ÷ 평균 하락폭 (기본 14봉, 평균 방식은 와일더 평활)', unit: '0~100 지수',
      check: '차트 지표에서 RSI 기간과 평균 방식을 확인한다. 같은 이름이라도 프로그램마다 계산이 조금 다를 수 있다.',
      mid: '강한 상승 추세에서는 RSI가 오래 70 이상에 머문다. 가격은 신고점인데 RSI는 낮아지는 것을 다이버전스라 하며 추세 약화의 단서로 본다.',
      adv: '70/30 기준이 특정 시장·기간에서 의미가 있는지는 별도 검증이 필요하다. 기준값을 바꿔가며 고르면 과최적화가 된다.',
      myth: ['RSI 30 아래면 산다 — 하락 추세에서는 과매도가 계속될 수 있다.'],
      limit: '가격에서 만든 지표라 가격 이상의 새 정보를 주지 않는다.',
      rel: ['macd', 'ma', 'trend', 'overfitting'], src: ['investor'],
      q: { q: 'RSI가 80이다. 가장 정확한 해석은?', o: ['곧 하락한다', '최근 상승 강도가 컸다는 뜻이며 방향을 단정할 수 없다', '거래량이 80%다', '매도 의무'], a: 1, why: 'RSI는 과거 움직임의 강도이고 미래 방향을 보장하지 않는다.' } }),

    T({ id: 'macd', ko: 'MACD', en: 'Moving Average Convergence Divergence', abbr: 'MACD', cat: 'indicator', lv: 2, hz: ['swing', 'months'],
      def: '짧은 지수이동평균과 긴 지수이동평균의 차이로 추세의 방향과 힘의 변화를 보는 지표다.',
      easy: '12봉 평균에서 26봉 평균을 뺀 값이 MACD선, 그 선의 9봉 평균이 신호선이다. MACD선이 신호선을 위로 넘으면 상승 쪽 힘이 강해졌다고 읽는다.',
      ex: 'EMA12 = 10,450, EMA26 = 10,300 → MACD = +150. 신호선이 +120이면 MACD가 신호선 위.',
      f: 'MACD = EMA(12) − EMA(26),  신호선 = EMA(9) of MACD,  히스토그램 = MACD − 신호선', unit: '가격과 같은 단위',
      check: '설정값(12, 26, 9)을 확인하고, 0선 위인지 아래인지와 신호선 교차를 함께 본다.',
      mid: '이동평균 기반이라 늦게 반응한다. 횡보장에서는 교차가 자주 일어나 헛신호가 많다.',
      adv: '가격 수준에 따라 값의 크기가 달라져 종목 간 비교가 어렵다. 비교하려면 비율(%)로 바꾼 형태를 쓴다.',
      myth: ['MACD 교차는 추세 전환을 예고한다 — 이미 일어난 변화를 늦게 보여준다.'],

    T({ id: 'risk-reward', ko: '손익비', en: 'Risk-Reward Ratio', abbr: 'R', cat: 'risk', lv: 1, hz: ['day', 'swing', 'months'],

/* js/views/common.js */
/* 화면 공통 부품: 필터 판정, 배지, 북마크 버튼, 퀴즈, 설정 패널 */
(function (SB) {
  const { esc, LEVELS, MARKETS, HORIZONS, TIMEFRAMES, HORIZON_TF } = SB.u;
  const store = SB.store;

  const f = {
    marketOK(item) { const m = store.prefs.market; return m === 'ALL' || !item.mk || item.mk.includes(m); },
    levelOK(item) { return (item.lv || 1) <= store.prefs.level; },
    horizonOK(item) { return !item.hz || item.hz.includes(store.prefs.horizon); },
  };

  function levelChip(lv) { return `<span class="chip lv${lv}" title="처음 배우는 수준">${LEVELS[lv]}</span>`; }
  function reviewChip(status) {
    const r = SB.meta.REVIEW[status] || SB.meta.REVIEW['ai-draft'];
    return `<span class="chip ${r.cls}" title="${esc(r.desc)}">${esc(r.label)}</span>`;
  }
  function marketChips(mk) {
    if (!mk) return '';
    return mk.map((m) => `<span class="chip">${m === 'KR' ? '한국' : '미국'}</span>`).join('');
  }
  function horizonChip(item) {
    return f.horizonOK(item) ? `<span class="chip match" title="선택한 투자 기간과 관련">${esc(HORIZONS[store.prefs.horizon].name)} 관련</span>` : '';
  }
  function starBtn(type, id) {
    const on = store.isBookmarked(type, id);
    return `<button type="button" class="star" data-star="${type}:${id}" aria-pressed="${on}">${on ? '★ 북마크됨' : '☆ 북마크'}</button>`;
  }
  function bindStars(root) {
    root.querySelectorAll('[data-star]').forEach((b) => {
      b.addEventListener('click', () => {
        const [type, id] = b.dataset.star.split(':');
        const on = store.toggleBookmark(type, id);
        b.setAttribute('aria-pressed', on);
        b.textContent = on ? '★ 북마크됨' : '☆ 북마크';
        SB.u.toast(on ? '북마크에 추가했습니다' : '북마크에서 뺐습니다');
      });
    });
  }

  function termLink(id) {
    const t = SB.content.termById[id];
    return t ? `<a href="#/terms/${t.id}">${esc(t.ko)}</a>` : '';
  }
  function patternLink(id) {
    const p = SB.content.patternById[id];
    return p ? `<a href="#/patterns/${p.id}">${esc(p.ko)}</a>` : '';
  }
  function sourcesBlock(keys, status, reviewedAt) {
    const items = (keys || []).map((k) => SB.meta.SOURCES[k]).filter(Boolean);
    const r = SB.meta.REVIEW[status] || SB.meta.REVIEW['ai-draft'];
    return `<div class="panel small">
      <div class="row"><strong>출처·검토</strong>${reviewChip(status)}<span class="muted">작성·확인일 ${esc(reviewedAt || SB.meta.CONTENT_DATE)}</span></div>
      <p class="muted">${esc(r.desc)}</p>
      <ul class="stack" style="margin:0;padding-left:1.1em">${items.map((s) => `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name)} <span class="muted">— ${esc(s.note)}</span></li>`).join('')}</ul>
    </div>`;
  }

  /* 퀴즈 하나 */
  function quiz(el, qid, q, onDone) {
    const prev = store.data.quiz[qid];
    el.innerHTML = `<div class="quiz panel">
      <div class="row"><span class="eyebrow">퀴즈</span>${prev ? `<span class="chip ${prev.ok ? 'reviewed' : 'draft'}">${prev.ok ? '지난번 정답' : '지난번 오답'}</span>` : ''}</div>
      <p class="q">${esc(q.q)}</p>
      <div class="opts">${q.o.map((o, i) => `<button type="button" data-i="${i}">${String.fromCharCode(9312 + i)} ${esc(o)}</button>`).join('')}</div>
      <p class="why" hidden></p>
    </div>`;
    const why = el.querySelector('.why');
    el.querySelectorAll('.opts button').forEach((b) => b.addEventListener('click', () => {
      const i = +b.dataset.i;
      const ok = i === q.a;
      el.querySelectorAll('.opts button').forEach((x) => {
        x.disabled = true;
        if (+x.dataset.i === q.a) x.dataset.state = 'right';
        else if (+x.dataset.i === i) x.dataset.state = 'wrong';
      });
      why.hidden = false;
      why.innerHTML = `<strong>${ok ? '정답입니다.' : '오답입니다. 오답 노트에 저장했습니다.'}</strong> ${esc(q.why)}`;
      store.recordQuiz(qid, ok);
      if (onDone) onDone(ok);
    }));
  }

  /* 모든 퀴즈 문제 목록 */
  function allQuestions() {
    const out = [];
    SB.content.TERMS.forEach((t) => out.push({ qid: 'term:' + t.id, q: t.q, src: { type: 'term', id: t.id, title: t.ko }, lv: t.lv, mk: t.mk, hz: t.hz }));
    SB.content.PATTERNS.forEach((p) => out.push({ qid: 'pattern:' + p.id, q: p.quiz, src: { type: 'pattern', id: p.id, title: p.ko }, lv: p.lv, mk: ['KR', 'US'], hz: p.hz }));
    return out;
  }

  /* 상단 설정 요약 */
  function renderPrefbar() {
    const p = store.prefs;
    const bar = document.getElementById('prefbar');
    const tf = TIMEFRAMES[p.tf];
    bar.innerHTML = `
      <button type="button" data-open="level">수준 <b>${LEVELS[p.level]}</b></button>
      <button type="button" data-open="market">시장 <b>${MARKETS[p.market]}</b></button>
      <button type="button" data-open="horizon">기간 <b>${HORIZONS[p.horizon].name}</b></button>
      <button type="button" data-open="tf">봉 <b>${tf.name}${tf.supported ? '' : ' (미지원)'}</b></button>`;
    bar.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => openPrefs(b.dataset.open)));
  }

  function prefsForm(idPrefix) {
    const p = store.prefs;
    const radio = (name, val, label, sub, checked) => {
      const id = `${idPrefix}-${name}-${val}`;
      return `<input type="radio" name="${idPrefix}-${name}" id="${id}" value="${val}" ${checked ? 'checked' : ''}><label for="${id}">${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</label>`;
    };
    return `<div class="setup">
      <fieldset id="${idPrefix}-level-fs"><legend>학습 수준</legend><div class="seg">
        ${radio('level', 1, '초급', '용어·거래·캔들·기초 위험', p.level === 1)}
        ${radio('level', 2, '중급', '추세·거래량·지표·기업 분석', p.level === 2)}
        ${radio('level', 3, '고급', '검증·불확실성·전략 평가', p.level === 3)}
      </div></fieldset>
      <fieldset id="${idPrefix}-market-fs"><legend>시장</legend><div class="seg">
        ${radio('market', 'ALL', '한국·미국 모두', '차이를 나란히 비교', p.market === 'ALL')}
        ${radio('market', 'KR', '한국', '원화·DART', p.market === 'KR')}
        ${radio('market', 'US', '미국', '달러·EDGAR', p.market === 'US')}
      </div></fieldset>
      <fieldset id="${idPrefix}-horizon-fs"><legend>투자 기간 <span class="muted small">(이 서비스의 학습용 분류)</span></legend><div class="seg">
        ${Object.entries(HORIZONS).map(([k, v]) => radio('horizon', k, v.name, v.hint, p.horizon === k)).join('')}
      </div></fieldset>
      <fieldset id="${idPrefix}-tf-fs"><legend>차트 봉 주기 <span class="muted small">(투자 기간과 따로 선택)</span></legend><div class="seg">
        ${Object.entries(TIMEFRAMES).map(([k, v]) => radio('tf', k, v.name, v.supported ? '' : '데이터 미연결', p.tf === k)).join('')}
      </div></fieldset>
      <p class="small muted" id="${idPrefix}-hint"></p>
    </div>`;
  }
  function bindPrefsForm(root, idPrefix, after) {
    const hint = root.querySelector(`#${idPrefix}-hint`);
    const update = () => {
      const p = store.prefs;
      const suggested = HORIZON_TF[p.horizon].map((k) => TIMEFRAMES[k].name).join('·');
      let msg = `학습 안내: "${HORIZONS[p.horizon].name}" 기간은 흔히 ${suggested}을 함께 봅니다. 규칙이 아니라 출발점입니다.`;
      if (p.tf === 'm') msg += ' 분봉 데이터는 연결되지 않아 차트는 개념 설명용 가상 데이터로만 보여줍니다.';
      if (p.horizon === 'day') msg += ' 당일 매매는 교육 콘텐츠만 제공하며, 분봉 분석 기능은 아직 지원하지 않습니다.';
      hint.textContent = msg;
    };
    root.querySelectorAll(`input[name^="${idPrefix}-"]`).forEach((inp) => inp.addEventListener('change', () => {
      const key = inp.name.slice(idPrefix.length + 1);
      const val = key === 'level' ? +inp.value : inp.value;
      store.setPref(key, val);
      update();
      renderPrefbar();
      if (after) after(key);
    }));
    update();
  }

  function openPrefs(focusKey) {
    const panel = document.getElementById('prefsPanel');
    const btn = document.getElementById('prefsBtn');
    if (!panel.hidden && !focusKey) { closePrefs(); return; }
    panel.innerHTML = `<div class="page" style="gap:12px">${prefsForm('pp')}<div class="row"><button class="btn primary" type="button" id="ppClose">적용하고 닫기</button><span class="small muted">선택은 이 기기에 저장되고 모든 화면에 바로 반영됩니다.</span></div></div>`;
    panel.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    bindPrefsForm(panel, 'pp', () => SB.app.rerender());
    panel.querySelector('#ppClose').addEventListener('click', closePrefs);
    const target = focusKey && panel.querySelector(`input[name="pp-${focusKey}"]:checked`);
    (target || panel.querySelector('input')).focus();
  }
  function closePrefs() {
    const panel = document.getElementById('prefsPanel');
    panel.hidden = true;
    document.getElementById('prefsBtn').setAttribute('aria-expanded', 'false');
  }

  function contextLine() {
    const p = store.prefs;
    return `<p class="small muted">현재 설정: ${LEVELS[p.level]} · ${MARKETS[p.market]} · ${HORIZONS[p.horizon].name} · ${TIMEFRAMES[p.tf].name}</p>`;
  }

  /* 시장별 차이 블록 */
  function marketDiff(item) {
    if (!item.kr && !item.us) return '';
    const m = store.prefs.market;
    const blocks = [];
    if ((m === 'ALL' || m === 'KR') && item.kr) blocks.push(`<div><span class="flag">한국</span><p>${esc(item.kr)}</p></div>`);
    if ((m === 'ALL' || m === 'US') && item.us) blocks.push(`<div><span class="flag">미국</span><p>${esc(item.us)}</p></div>`);
    if (!blocks.length) return '';
    return `<section class="section"><h3>시장별 차이</h3><div class="compare">${blocks.join('')}</div>
      <p class="small muted">제도·세율·시간은 바뀔 수 있습니다. 숫자는 작성일 기준 예시이며 공식 출처에서 확인하세요.</p></section>`;
  }

  SB.view = SB.view || {};
  SB.ui = { f, levelChip, reviewChip, marketChips, horizonChip, starBtn, bindStars, termLink, patternLink, sourcesBlock, quiz, allQuestions, renderPrefbar, prefsForm, bindPrefsForm, openPrefs, closePrefs, contextLine, marketDiff };
})(window.SB);

/* js/views/home.js */
/* 홈: 수준·시장·기간 선택, 이어서 공부하기, 설정에 맞춘 추천 */
(function (SB) {
  const { esc, HORIZONS, LEVELS, MARKETS } = SB.u;
  const ui = () => SB.ui;
  const store = SB.store;

  function recommend() {
    const { f } = ui();
    const terms = SB.content.TERMS.filter((t) => f.levelOK(t) && f.marketOK(t) && f.horizonOK(t));
    const unseen = terms.filter((t) => !store.isViewed('term', t.id));
    const pats = SB.content.PATTERNS.filter((p) => f.levelOK(p) && f.horizonOK(p));
    const nextPat = pats.find((p) => !store.isViewed('pattern', p.id)) || pats[0];
    const lessons = SB.content.LESSONS.filter((l) => f.levelOK(l) && f.marketOK(l) && f.horizonOK(l));
    return { terms, unseen, pats, nextPat, lessons };
  }

  function progress() {
    const T = SB.content.TERMS.length, P = SB.content.PATTERNS.length, Q = ui().allQuestions().length;
    const tv = SB.content.TERMS.filter((t) => store.isViewed('term', t.id)).length;
    const pv = SB.content.PATTERNS.filter((p) => store.isViewed('pattern', p.id)).length;
    const qd = Object.values(store.data.quiz).filter((q) => q.ok).length;
    return { T, P, Q, tv, pv, qd, pr: store.data.practice.length };
  }

  function render(main) {
    const p = store.prefs;
    const last = store.data.last;
    main.innerHTML = `<div class="page">
      <section class="hero">
        <span class="eyebrow">무료 주식 학습 · 한국·미국</span>
        <h1>용어, 차트, 기업, 위험을 한 줄로 잇는 공부</h1>
        <p class="lead">차트 모양을 외우기보다, 그 판단을 뒷받침하는 근거와 반대 근거를 함께 보는 연습을 합니다.</p>
        <div class="row">
          <span class="chip synthetic">차트는 설명용 가상 데이터</span>
          <span class="chip offline">실제 시세·공시 미연결</span>
          <span class="chip unverified">패턴 통계 미검증</span>
          <span class="chip draft">콘텐츠 AI 초안 · 검토 전</span>
        </div>
      </section>

      ${last ? `<a class="tile" href="${esc(last.route)}"><span class="eyebrow">이어서 공부하기</span><span class="k">${esc(last.title)}</span><span class="v">${SB.u.fmt.date(last.ts)}에 마지막으로 본 내용</span></a>` : ''}
      ${!store.persistent ? '<div class="notice warn">이 브라우저에서는 저장이 막혀 있어 학습 기록이 창을 닫으면 사라집니다.</div>' : ''}

      <section class="panel" aria-labelledby="setupTitle">
        <div class="section-head"><h2 id="setupTitle">무엇을, 어떤 깊이로 공부할까요?</h2><span class="small muted">언제든 위쪽 설정에서 바꿀 수 있습니다</span></div>
        ${ui().prefsForm('hp')}
      </section>

      <section class="section" id="homeRec" aria-live="polite"></section>
    </div>`;
    ui().bindPrefsForm(main, 'hp', () => renderRec(main));
    renderRec(main);
  }

  function renderRec(main) {
    const r = recommend();
    const pr = progress();

  function bar(label, v, t) {

  SB.view.home = (main) => { render(main); return { title: '홈' }; };
})(window.SB);

(function (SB) {

      <div class="section-head"><div><span class="eyebrow">용어 사전</span><h1>용어 ${SB.content.TERMS.length}개</h1></div>${ui.contextLine()}</div>
      <div class="panel">
        <div class="seg" role="radiogroup" aria-label="분류">
          ${[['all', '전체']].concat(Object.entries(CATS)).map(([k, v]) => `<input type="radio" name="tcat" id="tcat-${k}" value="${k}" ${catFilter === k ? 'checked' : ''}><label for="tcat-${k}">${esc(v)}</label>`).join('')}

        <label class="row small"><input type="checkbox" id="hzOnly" ${hzOnly ? 'checked' : ''}> 선택한 투자 기간(${esc(HORIZONS[store.prefs.horizon].name)})과 관련된 용어만</label>

    </div>`;

    main.querySelector('#hzOnly').addEventListener('change', (e) => { hzOnly = e.target.checked; list(main); main.querySelector('#hzOnly').focus(); });

  function detail(main, id) {
    const ui = SB.ui;

    const lv = store.prefs.level;

    const prev = SB.content.TERMS[idx - 1], next = SB.content.TERMS[idx + 1];
    const depth = (n, label, text) => text ? `<details class="more" ${lv >= n ? 'open' : ''}><summary>${label}${lv < n ? ' (현재 수준보다 깊은 설명)' : ''}</summary><div><p>${esc(text)}</p></div></details>` : '';
    const marketMismatch = store.prefs.market !== 'ALL' && !t.mk.includes(store.prefs.market);
    main.innerHTML = `<div class="page">
      <nav class="small"><a href="#/terms">용어 사전</a> · ${esc(SB.content.CATS[t.cat])}</nav>
      <header class="stack">
        <div class="row">${ui.levelChip(t.lv)}${ui.marketChips(t.mk)}${ui.horizonChip(t)}${ui.reviewChip(t.status)}</div>

      ${marketMismatch ? `<div class="notice">이 용어는 ${t.mk.map((m) => m === 'KR' ? '한국' : '미국').join('·')} 시장에 주로 해당합니다.</div>` : ''}
      ${t.lv > lv ? `<div class="notice warn">이 용어는 ${LEVELS[t.lv]} 내용입니다. 쉬운 설명부터 읽고, 깊은 설명은 펼쳐 보세요.</div>` : ''}
      <section class="panel"><span class="eyebrow">한 문장 정의</span><p style="font-size:1.12rem">${esc(t.def)}</p></section>
      <section class="prose"><h2>쉬운 설명</h2><p>${esc(t.easy)}</p></section>

        ${t.myth.length ? `<div class="panel"><h3>흔한 오해</h3><ul class="stack" style="margin:0;padding-left:1.1em">${t.myth.map((m) => `<li>${esc(m)}</li>`).join('')}</ul></div>` : ''}

      ${ui.marketDiff(t)}
      <section class="section"><h3>관련 용어</h3><div class="row">${t.rel.map((r) => { const x = SB.content.termById[r]; return x ? `<a class="chip" href="#/terms/${x.id}">${esc(x.ko)}</a>` : ''; }).join('')}
        ${SB.content.PATTERNS.filter((p) => p.terms.includes(t.id)).map((p) => `<a class="chip" href="#/patterns/${p.id}">도감: ${esc(p.ko)}</a>`).join('')}</div></section>

  SB.view.terms = (main, id) => id ? detail(main, id) : list(main);
})(window.SB);

/* js/views/patterns.js */
/* 차트 패턴 도감: 목록 + 상세(성공·실패 비교, 조건, 무효화, 시나리오, 통계 상태) */
(function (SB) {
  const { esc, LEVELS, TIMEFRAMES } = SB.u;
  const store = SB.store;

  /* 패턴 정의(수준 단위) → 현재 시장·봉 주기의 가상 가격 데이터와 주석 */
  function build(spec) {
    const s = SB.synth.series({
      anchors: spec.anchors, n: spec.n, seed: spec.seed, volume: spec.volume, overrides: spec.overrides,
      market: store.prefs.market, tf: store.prefs.tf,
    });
    const ann = (spec.ann || []).map((a) => {
      const o = Object.assign({}, a);
      if (a.t === 'h') o.price = s.toPrice(a.lv);
      if (a.t === 'seg') { o.a = [a.a[0], s.toPrice(a.a[1])]; o.b = [a.b[0], s.toPrice(a.b[1])]; }
      return o;
    });
    return { bars: s.bars, meta: s.meta, ann, ma: spec.ma };
  }

  function spark(spec) {
    const s = SB.synth.series({ anchors: spec.anchors, n: spec.n, seed: spec.seed, market: 'ALL', tf: 'D' });
    const cs = s.bars.map((b) => b.c);
    const lo = Math.min(...cs), hi = Math.max(...cs);
    const pts = cs.map((c, i) => `${(i / (cs.length - 1) * 118 + 1).toFixed(1)},${(34 - (c - lo) / (hi - lo || 1) * 30).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 120 36" width="120" height="36" aria-hidden="true"><polyline points="${pts}" style="fill:none;stroke:var(--ink);stroke-width:1.5"/></svg>`;
  }

  function list(main) {
    const ui = SB.ui;
    const P = SB.content.PATTERNS;

      <div class="list">${P.map((p, i) => `<a class="list-item" href="#/patterns/${p.id}">

      </a>`).join('')}</div>
      <section class="panel"><h3>관련 지표 학습</h3><p class="small muted">패턴 판단을 보조할 때 자주 쓰는 지표입니다. 지표도 가격에서 계산한 값이라 새로운 정보를 더하지는 않습니다.</p>
        <div class="row">${['ma', 'rsi', 'macd', 'bollinger'].map((id) => `<a class="chip" href="#/terms/${id}">${esc(SB.content.termById[id].ko)}</a>`).join('')}</div></section>
    </div>`;
    return { title: '차트 도감' };
  }

  function detail(main, id) {

        <p>${esc(p.stats.reason)}</p>
        <p class="small"><strong>검증할 판정 규칙(초안):</strong> ${esc(p.stats.rule)}</p>
        <p class="small muted">이 패턴의 "성공 확률"을 숫자로 보여주지 않는 이유와 검증 방법은 <a href="#/stats">검증·통계</a>에서 볼 수 있습니다.</p>
      </section>
      <section class="section"><h3>관련 용어·지표</h3><div class="row">
        ${p.terms.concat(p.indicators.filter((x) => !p.terms.includes(x))).map((tid) => { const t = SB.content.termById[tid]; return t ? `<a class="chip" href="#/terms/${t.id}">${esc(t.ko)}</a>` : ''; }).join('')}
        ${SB.content.PRACTICE.filter((q) => q.patterns.includes(p.id)).map((q) => `<a class="chip match" href="#/practice/${q.id}">연습: ${esc(q.title)}</a>`).join('')}
      </div></section>
      <div id="patQuiz"></div>
      ${ui.sourcesBlock(['textbook'], p.status, p.reviewedAt)}
      <nav class="row" style="justify-content:space-between">
        ${prev ? `<a class="btn" href="#/patterns/${prev.id}">← ${esc(prev.ko)}</a>` : '<span></span>'}
        ${next ? `<a class="btn" href="#/patterns/${next.id}">${esc(next.ko)} →</a>` : ''}
      </nav>
    </div>`;
    const s = build(p.charts.success), fl = build(p.charts.failure);
    SB.chart.mount(main.querySelector('#chS'), { bars: s.bars, meta: s.meta, annotations: s.ann, ma: s.ma, title: '성공 사례' });
    SB.chart.mount(main.querySelector('#chF'), { bars: fl.bars, meta: fl.meta, annotations: fl.ann, ma: fl.ma, title: '실패 사례' });
    ui.bindStars(main);
    ui.quiz(main.querySelector('#patQuiz'), 'pattern:' + p.id, p.quiz);
    store.markViewed('pattern', p.id);
    return { title: p.ko };
  }

  SB.view.patterns = (main, id) => id ? detail(main, id) : list(main);
  SB.view.patternBuild = build;
})(window.SB);

/* js/views/practice.js */
/* 차트 연습실: 미래 구간을 가린 차트 → 판단 근거·반대 근거 기록 → 공개 → 과정과 결과를 따로 평가 */
(function (SB) {
  const { esc, fmt } = SB.u;
  const store = SB.store;
  const DECISION = { up: '오를 것 같다', down: '내릴 것 같다', hold: '판단 보류 (정보 부족)' };

  function list(main) {
    const ui = SB.ui;
    const { f } = ui;
    const hist = store.data.practice.slice(0, 6);
    const items = SB.content.PRACTICE.slice().sort((a, b) => (f.horizonOK(b) - f.horizonOK(a)) || (a.lv - b.lv));
    main.innerHTML = `<div class="page">
      <div class="section-head"><div><span class="eyebrow">차트 연습실</span><h1>가린 미래를 두고 판단하기</h1></div>${ui.contextLine()}</div>
      <p class="lead">결과를 맞히는 연습이 아니라, 근거와 반대 근거를 적고 판단을 바꿀 조건을 미리 정하는 연습입니다. 결과가 맞아도 과정이 약하면 운이었을 수 있습니다.</p>
      <div class="list">${items.map((q) => {
        const done = store.data.practice.filter((r) => r.pid === q.id).length;
        return `<a class="list-item" href="#/practice/${q.id}"><span class="t">${esc(q.title)}</span><span class="row">${done ? `<span class="chip">${done}회 풀이</span>` : ''}</span><span class="d">${esc(q.prompt)}</span><span class="tags">${ui.levelChip(q.lv)}${ui.horizonChip(q)}<span class="chip synthetic">가상 데이터</span></span></a>`;
      }).join('')}</div>
      ${hist.length ? `<section class="section"><h2>최근 기록</h2><div class="table-wrap"><table class="tbl"><thead><tr><th>날짜</th><th>문제</th><th>내 판단</th><th>공개 결과</th><th class="n">과정 점검</th></tr></thead><tbody>
        ${hist.map((r) => `<tr><td>${fmt.date(r.ts)}</td><td>${esc(r.title)}</td><td>${esc(DECISION[r.decision])}</td><td>${esc(r.outcomeLabel)} (${fmt.spct(r.ret)})</td><td class="n">${r.score}/5</td></tr>`).join('')}
      </tbody></table></div></section>` : ''}
    </div>`;
    return { title: '차트 연습실' };
  }

  function makeData(q) {
    const market = store.prefs.market;
    if (q.random) {
      const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
      const mb = SB.synth.MARKET_BASE[market];
      const sig = { m: 0.006, D: 0.018, W: 0.035, M: 0.06 }[store.prefs.tf] || 0.018;
      const rw = SB.synth.randomWalk({ n: q.n, seed, sigma: sig, start: mb.base });
      const tick = mb.tick;
      rw.bars.forEach((b) => ['o', 'h', 'l', 'c'].forEach((k) => { b[k] = Math.round(b[k] / tick) * tick; }));
      return { bars: rw.bars, meta: { synthetic: true, market, currency: mb.currency, decimals: mb.decimals, tf: store.prefs.tf, source: '무작위 보행으로 직접 생성한 합성 데이터 (seed ' + seed + ')', asOf: '해당 없음(가상)' }, ann: [], threshold: 0.03, seed };
    }
    const b = SB.view.patternBuild({ anchors: q.anchors, n: q.n, seed: q.seed, volume: q.volume, overrides: q.overrides, ann: [] });
    return { bars: b.bars, meta: b.meta, ann: [], threshold: 0.03 * SB.synth.TF_SHAPE[store.prefs.tf].amp };
  }

  function outcome(bars, hide, threshold) {
    const base = bars[hide - 1].c;
    const end = bars[bars.length - 1].c;
    let hi = -Infinity, lo = Infinity;
    for (let i = hide; i < bars.length; i++) { hi = Math.max(hi, bars[i].h); lo = Math.min(lo, bars[i].l); }
    const ret = end / base - 1;
    const label = ret > threshold ? 'up' : ret < -threshold ? 'down' : 'flat';
    return { ret, maxUp: hi / base - 1, maxDown: lo / base - 1, label, threshold };
  }
  const OUT_LABEL = { up: '상승', down: '하락', flat: '뚜렷하지 않음(옆걸음)' };

  function detail(main, id) {
    const ui = SB.ui;
    const q = SB.content.practiceById[id];
    if (!q) { main.innerHTML = '<div class="page"><p>문제를 찾을 수 없습니다. <a href="#/practice">연습실로</a></p></div>'; return { title: '없음' }; }
    const data = makeData(q);
    const patOpts = SB.content.PATTERNS.map((p) => `<option value="${esc(p.ko)}">${esc(p.ko)}</option>`).join('');
    main.innerHTML = `<div class="page">
      <nav class="small"><a href="#/practice">차트 연습실</a></nav>
      <header class="stack"><div class="row">${ui.levelChip(q.lv)}<span class="chip synthetic">설명용 가상 데이터</span>${ui.reviewChip(q.status)}</div><h1>${esc(q.title)}</h1><p class="lead">${esc(q.prompt)}</p></header>
      <div id="pChart"></div>
      <form id="pForm" class="panel" novalidate>
        <h2>내 판단 기록</h2>
        <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl">가려진 ${q.n - q.hide}봉 뒤 종가는?</legend>
          <div class="seg">${Object.entries(DECISION).map(([k, v]) => `<input type="radio" name="dec" id="dec-${k}" value="${k}"><label for="dec-${k}">${esc(v)}</label>`).join('')}</div>
          <span class="hint">정보가 부족하면 보류도 좋은 선택입니다. 보류는 맞고 틀림으로 평가하지 않습니다.</span>
        </fieldset>
        <div class="field"><label for="f-pattern">관찰한 패턴</label>
          <select id="f-pattern"><option value="">선택 안 함</option>${patOpts}<option value="뚜렷한 패턴 없음">뚜렷한 패턴 없음</option></select>
          <input id="f-pattern2" placeholder="직접 적기 (예: 두 번째 바닥 이후 반등 중)" aria-label="관찰한 패턴 직접 적기"></div>
        <div class="field"><label for="f-support">판단을 뒷받침하는 근거</label><textarea id="f-support" placeholder="예: 같은 가격대에서 두 번 반등"></textarea></div>
        <div class="field"><label for="f-counter">반대 근거</label><textarea id="f-counter" placeholder="예: 넥라인을 아직 넘지 못함, 거래량이 적음"></textarea></div>
        <div class="field"><label for="f-needed">추가로 필요한 정보</label><textarea id="f-needed" placeholder="예: 주봉 추세, 공시 일정, 시장 전체 흐름"></textarea></div>
        <div class="field"><label for="f-change">판단을 바꿀 조건</label><textarea id="f-change" placeholder="예: 두 번째 바닥 아래로 종가 마감하면 판단 폐기"></textarea></div>
        <p class="small" id="pErr" role="alert" hidden></p>
        <div class="row"><button class="btn primary" type="submit">기록하고 미래 구간 공개</button><span class="small muted">기록은 이 기기에 저장됩니다.</span></div>
      </form>
      <section id="pResult" class="section" hidden></section>
    </div>`;
    const chart = SB.chart.mount(main.querySelector('#pChart'), { bars: data.bars, meta: data.meta, annotations: data.ann, hideFrom: q.hide, title: '미래 구간 가림' });
    const form = main.querySelector('#pForm');
    form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const dec = form.querySelector('input[name="dec"]:checked');
      const err = main.querySelector('#pErr');
      if (!dec) { err.hidden = false; err.textContent = '먼저 판단(오를 것 같다 / 내릴 것 같다 / 보류)을 하나 고르세요.'; form.querySelector('#dec-up').focus(); return; }
      err.hidden = true;
      const val = (sel) => form.querySelector(sel).value.trim();
      const rec = {
        decision: dec.value,
        pattern: [val('#f-pattern'), val('#f-pattern2')].filter(Boolean).join(' / '),
        support: val('#f-support'), counter: val('#f-counter'), needed: val('#f-needed'), change: val('#f-change'),
      };
      chart.reveal();
      form.querySelectorAll('input,textarea,select,button').forEach((x) => { x.disabled = true; });
      const out = outcome(data.bars, q.hide, data.threshold);
      showResult(main, q, rec, out, data);
    });
    return { title: q.title };
  }

  function showResult(main, q, rec, out, data) {
    const checks = [
      ['관찰한 패턴을 적었다', !!rec.pattern],
      ['판단 근거를 적었다', rec.support.length >= 4],
      ['반대 근거를 적었다', rec.counter.length >= 4],
      ['추가로 필요한 정보를 적었다', rec.needed.length >= 4],
      ['판단을 바꿀 조건을 적었다', rec.change.length >= 4],
    ];
    const score = checks.filter((c) => c[1]).length;
    const strong = score >= 4;
    let verdict;
    if (rec.decision === 'hold') {
      verdict = strong
        ? '보류를 선택했고 그 이유와 필요한 정보를 적었습니다. 근거가 맞설 때의 보류는 좋은 판단 과정입니다. 결과와 비교해 점수를 매기지 않습니다.'
        : '보류를 선택했습니다. 다음에는 왜 보류했는지(반대 근거)와 무엇을 더 알아야 하는지 적어 보세요.';
    } else {
      const hit = rec.decision === out.label;
      if (strong && hit) verdict = '판단 과정이 탄탄했고 결과도 판단과 같았습니다. 그래도 한 번의 결과는 운의 영향을 받습니다. 같은 과정을 여러 번 반복한 기록으로 평가하세요.';
      else if (strong && !hit) verdict = '결과는 판단과 달랐지만 과정은 탄탄했습니다. 미리 적은 "판단을 바꿀 조건"이 공개된 구간에서 언제 발동했을지 차트에서 찾아보세요. 그 지점에서 손실을 끊을 수 있었다면 좋은 판단 과정입니다.';
      else if (!strong && hit) verdict = '결과는 판단과 같았지만 반대 근거나 무효화 조건이 부족했습니다. 이번 결과는 운의 몫이 컸을 수 있습니다.';
      else verdict = '결과도 판단과 달랐고 과정 기록도 부족했습니다. 아래 해설의 반대 근거와 판단을 바꿀 조건을 참고해 다시 풀어 보세요.';
      if (out.label === 'flat') verdict = '공개 구간은 뚜렷한 방향이 없었습니다. ' + (strong ? '과정 기록은 충분했습니다. ' : '') + '이런 경우 방향 판단보다 보류가 나았을 수 있습니다.';
    }
    const m = q.model;
    const li = (arr) => `<ul class="stack" style="margin:0;padding-left:1.1em">${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
    const mine = (t) => t ? esc(t) : '<span class="muted">(적지 않음)</span>';
    const box = main.querySelector('#pResult');
    box.hidden = false;
    box.innerHTML = `
      <h2>공개 결과와 해설</h2>
      <div class="grid-2">
        <div class="panel"><h3>가려졌던 구간의 결과</h3>
          <dl class="kv">
            <dt>마지막 공개 종가 대비</dt><dd class="num">${fmt.spct(out.ret, 1)} → ${esc(OUT_LABEL[out.label])}</dd>
            <dt>구간 중 최고</dt><dd class="num">${fmt.spct(out.maxUp, 1)}</dd>
            <dt>구간 중 최저</dt><dd class="num">${fmt.spct(out.maxDown, 1)}</dd>
          </dl>
          <p class="small muted">판정 기준: ±${(out.threshold * 100).toFixed(1)}% 밖이면 상승·하락, 안이면 옆걸음. 가상 데이터의 결과이며 실제 시장 통계가 아닙니다.</p>
        </div>
        <div class="panel verdict"><h3>과정 점검 ${score}/5</h3>
          <ul class="check">${checks.map((c) => `<li class="${c[1] ? '' : 'no'}">${esc(c[0])}</li>`).join('')}</ul>
          <p><strong>내 판단:</strong> ${esc(DECISION[rec.decision])}</p>
          <p>${esc(verdict)}</p>
        </div>
      </div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th style="width:22%">항목</th><th>내 기록</th><th>해설 예시</th></tr></thead><tbody>
        <tr><td>관찰한 패턴</td><td>${mine(rec.pattern)}</td><td>${esc(m.pattern)}</td></tr>
        <tr><td>판단 근거</td><td>${mine(rec.support)}</td><td>${li(m.support)}</td></tr>
        <tr><td>반대 근거</td><td>${mine(rec.counter)}</td><td>${li(m.counter)}</td></tr>
        <tr><td>추가로 필요한 정보</td><td>${mine(rec.needed)}</td><td>${li(m.needed)}</td></tr>
        <tr><td>판단을 바꿀 조건</td><td>${mine(rec.change)}</td><td>${li(m.change)}</td></tr>
      </tbody></table></div>
      <div class="notice"><strong>이 문제에서 배울 점</strong><span>${esc(q.lesson)}</span></div>
      <div class="row">
        <a class="btn primary" href="#/practice/${q.id}" data-retry>${q.random ? '새 무작위 차트로 다시' : '다시 풀기'}</a>
        <a class="btn" href="#/practice">다른 문제</a>
        ${q.patterns.map((pid) => SB.content.patternById[pid] ? `<a class="btn ghost" href="#/patterns/${pid}">도감: ${esc(SB.content.patternById[pid].ko)}</a>` : '').join('')}
      </div>`;
    box.querySelector('[data-retry]').addEventListener('click', (e) => { e.preventDefault(); SB.app.rerender(); window.scrollTo(0, 0); });
    store.addPractice({ pid: q.id, title: q.title, ts: Date.now(), decision: rec.decision, outcome: out.label, outcomeLabel: OUT_LABEL[out.label], ret: out.ret, score, tf: store.prefs.tf, market: store.prefs.market, seed: data.seed || q.seed, notes: rec });
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  SB.view.practice = (main, id) => id ? detail(main, id) : list(main);
  SB.view.practiceOutcome = outcome;
  SB.view.practiceData = makeData;
})(window.SB);

/* js/views/quiz.js */
/* 퀴즈: 현재 설정 / 오답만 / 전체 범위에서 문제를 골라 한 문제씩 */
(function (SB) {
  const { esc } = SB.u;
  const store = SB.store;
  let session = null;

  function pool(scope) {
    const { f } = SB.ui;
    const all = SB.ui.allQuestions();
    if (scope === 'wrong') return all.filter((x) => store.data.quiz[x.qid] && !store.data.quiz[x.qid].ok);
    if (scope === 'all') return all;
    return all.filter((x) => f.levelOK(x) && f.marketOK(x) && f.horizonOK(x));
  }
  function shuffle(a, seed) {
    const r = SB.rng(seed);
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) { const j = r.int(i + 1); [b[i], b[j]] = [b[j], b[i]]; }
    return b;
  }

  function start(main, scope, count) {
    const p = pool(scope);
    session = { scope, items: shuffle(p, Date.now() >>> 0).slice(0, count), i: 0, right: 0 };
    step(main);
  }

  function step(main) {
    const s = session;
    if (s.i >= s.items.length) {
      main.innerHTML = `<div class="page"><span class="eyebrow">퀴즈 결과</span><h1>${s.items.length}문제 중 ${s.right}문제 정답</h1>
        <p class="lead">틀린 문제는 오답 노트에 남았습니다. 해당 용어나 패턴 화면에서 설명을 다시 읽어 보세요.</p>
        <div class="row"><button class="btn primary" type="button" id="qAgain">같은 범위로 다시</button><a class="btn" href="#/me">오답 노트</a><a class="btn" href="#/quiz">범위 바꾸기</a></div></div>`;
      main.querySelector('#qAgain').addEventListener('click', () => start(main, s.scope, s.items.length));
      session = null;
      return;
    }
    const it = s.items[s.i];
    main.innerHTML = `<div class="page">
      <div class="section-head"><span class="eyebrow">퀴즈 ${s.i + 1} / ${s.items.length}</span><span class="small muted">정답 ${s.right}</span></div>
      <div class="progress"><span style="width:${(s.i / s.items.length) * 100}%"></span></div>
      <div id="qBox"></div>
      <p class="small">출처 화면: <a href="#/${it.src.type === 'term' ? 'terms' : 'patterns'}/${it.src.id}">${esc(it.src.title)}</a></p>
      <div class="row"><button class="btn primary" type="button" id="qNext" disabled>다음 문제</button></div>
    </div>`;
    const next = main.querySelector('#qNext');
    SB.ui.quiz(main.querySelector('#qBox'), it.qid, it.q, (ok) => { if (ok) s.right++; next.disabled = false; next.focus(); });
    next.addEventListener('click', () => { s.i++; step(main); });
  }

  function home(main) {
    const now = pool('current').length, wrong = pool('wrong').length, all = pool('all').length;
    main.innerHTML = `<div class="page">
      <div class="section-head"><div><span class="eyebrow">퀴즈</span><h1>개념 확인 문제</h1></div>${SB.ui.contextLine()}</div>
      <form class="panel" id="qStart">
        <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl">범위</legend><div class="seg">
          <input type="radio" name="qs" id="qs-current" value="current" checked ${now ? '' : 'disabled'}><label for="qs-current">현재 설정<small>${now}문제</small></label>
          <input type="radio" name="qs" id="qs-wrong" value="wrong" ${wrong ? '' : 'disabled'}><label for="qs-wrong">오답만<small>${wrong}문제</small></label>
          <input type="radio" name="qs" id="qs-all" value="all"><label for="qs-all">전체<small>${all}문제</small></label>
        </div></fieldset>
        <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl">문제 수</legend><div class="seg">
          <input type="radio" name="qn" id="qn-5" value="5" checked><label for="qn-5">5문제</label>
          <input type="radio" name="qn" id="qn-10" value="10"><label for="qn-10">10문제</label>

      <div class="notice warn"><strong>실제 공시·재무 데이터 미연결</strong>

      ${lessonsHTML('company')}
      <section class="panel" id="valcalc">
        <div class="row"><h2>지표 연결 계산기</h2><span class="chip synthetic">가상 기업 예시</span></div>
        <p class="small muted">숫자를 바꿔 PER·PBR·ROE가 어떻게 함께 움직이는지 보세요. 기본값은 지어낸 회사의 예시입니다.</p>
        <div class="grid-3">

          <div class="field"><label for="v-ni">연간 순이익</label><input id="v-ni" type="number" inputmode="decimal" value="20000000000"></div>

/* js/views/risk.js */
/* 위험 관리: 강의 + 계산기 (손익비, 투자 비중, 비용, 분산, 낙폭·연속 손실, 환율) */
(function (SB) {
  const { esc, fmt } = SB.u;

  const num = (main, id) => parseFloat(main.querySelector('#' + id).value);
  const field = (id, label, val, hint) => `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="number" inputmode="decimal" step="any" value="${val}">${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;

  /* 승률 p로 n번 거래할 때 k연패 이상이 한 번이라도 나올 확률 (거래 독립 가정, 동적 계획법) */
  function probRun(n, k, p) {
    const q = 1 - p; // 한 번 질 확률
    // dp[j] = 현재 연패 길이가 j이고 아직 k연패가 없었던 확률
    let dp = new Array(k).fill(0); dp[0] = 1;
    for (let t = 0; t < n; t++) {
      const nd = new Array(k).fill(0);
      for (let j = 0; j < k; j++) {
        nd[0] += dp[j] * p;
        if (j + 1 < k) nd[j + 1] += dp[j] * q;
      }
      dp = nd;
    }
    return 1 - dp.reduce((a, b) => a + b, 0);
  }

  function render(main) {
    const ui = SB.ui;
    const us = SB.store.prefs.market === 'US';
    main.innerHTML = `<div class="page">

      <p class="lead">모든 계산기는 입력한 숫자로만 계산합니다. 세율·수수료는 바뀔 수 있어 기본값을 0이나 예시로 두었으니 최신 값을 직접 넣으세요.</p>

      <section class="panel" id="rr">

        <div class="grid-3">${field('rr-entry', '진입가', us ? 50 : 10000)}${field('rr-target', '목표가', us ? 55 : 11000)}${field('rr-stop', '손절가', us ? 47.5 : 9500)}${field('rr-cost', '왕복 비용 (%)', 0.3, '수수료+세금+스프레드 추정')}</div>
        <div id="rr-out" aria-live="polite"></div>
      </section>

      <section class="panel" id="sizing">
        <h2>투자 비중 계산기</h2>
        <div class="grid-3">${field('ps-acct', '계좌 금액', us ? 10000 : 10000000)}${field('ps-risk', '1회 허용 손실 (계좌 대비 %)', 1)}${field('ps-entry', '진입가', us ? 50 : 10000)}${field('ps-stop', '손절가', us ? 47.5 : 9500)}${field('ps-gap', '갭 위험 가정 (손절가 아래 추가 %)', 3, '손절가보다 더 낮게 체결될 가능성')}</div>
        <div id="ps-out" aria-live="polite"></div>
      </section>

      <section class="panel" id="cost">
        <h2>거래비용 계산기</h2>
        <div class="grid-3">${field('c-comm', '수수료 (편도, %)', 0.015)}${field('c-tax', '매도 세금 (%) — 최신 세율 입력', 0, '세율은 정책에 따라 바뀝니다')}${field('c-spread', '스프레드·슬리피지 (왕복, %)', 0.2)}${field('c-fx', '환전 비용 (왕복, %)', us ? 0.5 : 0, '해외 주식일 때')}${field('c-trades', '연간 왕복 횟수', 24)}${field('c-gross', '1회 평균 매매 수익률 (%)', 1)}</div>
        <div id="c-out" aria-live="polite"></div>
      </section>

      <section class="panel" id="div">
        <h2>분산 효과 계산기 (두 자산)</h2>
        <div class="grid-3">${field('d-w', '자산 A 비중 (%)', 50)}${field('d-s1', '자산 A 변동성 (연, %)', 30)}${field('d-s2', '자산 B 변동성 (연, %)', 30)}</div>
        <div class="field"><label for="d-rho">상관관계: <output id="d-rho-v">0.0</output></label><input id="d-rho" type="range" min="-1" max="1" step="0.1" value="0"></div>
        <div id="d-out" aria-live="polite"></div>
      </section>

      <section class="panel" id="dd">
        <h2>낙폭 회복과 연속 손실</h2>
        <div class="grid-3">${field('dd-loss', '손실률 (%)', 30)}${field('dd-p', '승률 (%)', 45)}${field('dd-n', '거래 횟수', 50)}${field('dd-k', '연패 길이', 5)}</div>
        <div id="dd-out" aria-live="polite"></div>
        <p class="small muted">연속 손실 확률은 거래가 서로 독립이라는 가정의 계산입니다. 실제로는 시장 국면에 따라 손실이 몰려 올 수 있습니다.</p>
      </section>

      <section class="panel" id="fx">
        <h2>환율 효과 분리 (미국 주식, 원화 기준)</h2>
        <div class="grid-3">${field('fx-buy', '매수가 (달러)', 100)}${field('fx-sell', '현재가 (달러)', 110)}${field('fx-r0', '매수 시 환율 (원/달러)', 1350)}${field('fx-r1', '현재 환율 (원/달러)', 1300)}</div>
        <div id="fx-out" aria-live="polite"></div>
        <p class="small muted">기본값은 계산 예시이며 실제 환율이 아닙니다.</p>
      </section>

      ${SB.view.lessonsHTML('risk')}
    </div>`;
    SB.view.afterLessons(main, 'risk');

    const kv = (rows) => `<dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd class="num">${v}</dd>`).join('')}</dl>`;
    const calcRR = () => {
      const e = num(main, 'rr-entry'), t = num(main, 'rr-target'), s = num(main, 'rr-stop'), c = num(main, 'rr-cost') / 100;
      const out = main.querySelector('#rr-out');
      if (!(t > e && s < e)) { out.innerHTML = '<p class="notice bad">매수 기준으로 목표가는 진입가보다 높고, 손절가는 낮아야 합니다.</p>'; return; }
      const win = t / e - 1 - c, loss = 1 - s / e + c;
      const rr = (t - e) / (e - s), rrNet = win / loss;
      out.innerHTML = kv([
        ['손익비 (비용 전)', fmt.n(rr, 2) + ' 배'],
        ['손익분기 승률 (비용 전)', fmt.pct(1 / (1 + rr))],
        ['비용 반영 이익 / 손실', fmt.spct(win, 2) + ' / ' + fmt.spct(-loss, 2)],
        ['손익분기 승률 (비용 반영)', win > 0 ? fmt.pct(loss / (win + loss)) : '이익이 비용보다 작음'],
      ]) + '<p class="small muted">손익분기 승률은 목표가와 손절가 중 하나에 반드시 닿는다는 단순 가정입니다.</p>';
    };
    const calcPS = () => {
      const a = num(main, 'ps-acct'), r = num(main, 'ps-risk') / 100, e = num(main, 'ps-entry'), s = num(main, 'ps-stop'), g = num(main, 'ps-gap') / 100;
      const out = main.querySelector('#ps-out');
      if (!(e > s && a > 0 && r > 0)) { out.innerHTML = '<p class="notice bad">손절가는 진입가보다 낮고, 계좌와 허용 손실은 0보다 커야 합니다.</p>'; return; }
      const qty = Math.floor(a * r / (e - s));
      const cap = qty * e;
      const gapLoss = qty * (e - s * (1 - g));
      out.innerHTML = kv([
        ['최대 수량', fmt.n(qty) + ' 주'],
        ['투자금', fmt.n(cap, us ? 2 : 0) + ` (계좌의 ${fmt.pct(cap / a)})`],
        ['계획 손실 (손절 체결 시)', fmt.n(qty * (e - s), us ? 2 : 0) + ` (${fmt.pct(qty * (e - s) / a, 2)})`],
        ['갭 가정 시 손실', fmt.n(gapLoss, us ? 2 : 0) + ` (${fmt.pct(gapLoss / a, 2)})`],
      ]) + (cap > a ? '<p class="notice warn">계산된 투자금이 계좌보다 큽니다. 손절 폭이 너무 좁거나 허용 손실이 큽니다.</p>' : '');
    };
    const calcCost = () => {
      const rt = num(main, 'c-comm') * 2 + num(main, 'c-tax') + num(main, 'c-spread') + num(main, 'c-fx');
      const n = num(main, 'c-trades'), g = num(main, 'c-gross');
      main.querySelector('#c-out').innerHTML = kv([
        ['왕복 비용', rt.toFixed(3) + '%'],
        ['1회 비용 차감 수익률', (g - rt).toFixed(3) + '%'],
        ['연간 비용 합계 (단순 합)', (rt * n).toFixed(2) + '%'],
      ]);
    };
    const calcDiv = () => {
      const w = num(main, 'd-w') / 100, s1 = num(main, 'd-s1') / 100, s2 = num(main, 'd-s2') / 100, rho = +main.querySelector('#d-rho').value;
      main.querySelector('#d-rho-v').textContent = rho.toFixed(1);
      const v = Math.sqrt(Math.max(0, w * w * s1 * s1 + (1 - w) * (1 - w) * s2 * s2 + 2 * w * (1 - w) * rho * s1 * s2));
      const naive = w * s1 + (1 - w) * s2;
      main.querySelector('#d-out').innerHTML = kv([
        ['포트폴리오 변동성', fmt.pct(v)],
        ['단순 가중평균 (상관 1일 때)', fmt.pct(naive)],
        ['분산으로 줄어든 폭', fmt.pct(naive - v)],
      ]);
    };
    const calcDD = () => {
      const L = num(main, 'dd-loss') / 100, p = num(main, 'dd-p') / 100, n = Math.round(num(main, 'dd-n')), k = Math.round(num(main, 'dd-k'));

      out.innerHTML = kv([
        ['회복에 필요한 수익률', fmt.spct(1 / (1 - L) - 1)],
        [`${n}번 중 ${k}연패 이상이 한 번이라도 나올 확률`, fmt.pct(probRun(n, k, p))],

    const calcFX = () => {
      const b = num(main, 'fx-buy'), s = num(main, 'fx-sell'), r0 = num(main, 'fx-r0'), r1 = num(main, 'fx-r1');

        ['달러 기준 수익률', fmt.spct(usd)],
        ['환율 변화', fmt.spct(fx)],
        ['원화 기준 수익률', fmt.spct(krw)],
        ['교차 효과', fmt.spct(krw - usd - fx, 2)],
      ]);
    };
    const binds = [['rr-', calcRR], ['ps-', calcPS], ['c-', calcCost], ['d-', calcDiv], ['dd-', calcDD], ['fx-', calcFX]];
    binds.forEach(([pre, fn]) => { main.querySelectorAll(`input[id^="${pre}"]`).forEach((i) => i.addEventListener('input', fn)); fn(); });
    return { title: '위험 관리' };
  }

  SB.view.risk = render;
  SB.view.probRun = probRun;
})(window.SB);
