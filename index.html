<html lang="ko">

<meta name="description" content="주식 용어, 차트 모양, 기업 분석, 위험 관리를 연결해서 공부하는 무료 학습 서비스">
<meta name="theme-color" content="#16222c">

<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<div class="shell">
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/" aria-label="주식 투자 바이블 홈">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">주식 투자 바이블</span>
      </a>
      <form class="search" id="searchForm" role="search">
        <label for="searchInput" class="sr">용어·패턴·강의 검색</label>
        <input id="searchInput" type="search" placeholder="용어·패턴 검색 (예: PER, 쌍바닥)" autocomplete="off">
      </form>
      <button class="icon-btn" id="prefsBtn" aria-expanded="false" aria-controls="prefsPanel" title="학습 설정">설정</button>
    </div>
    <div class="prefbar" id="prefbar" aria-live="polite"></div>
    <div class="prefs-panel" id="prefsPanel" hidden></div>
  </header>

  <nav class="sidenav" aria-label="주요 메뉴">
    <a href="#/" data-nav="home">홈</a>
    <a href="#/terms" data-nav="terms">용어 사전</a>
    <a href="#/patterns" data-nav="patterns">차트 도감</a>
    <a href="#/practice" data-nav="practice">차트 연습실</a>
    <a href="#/quiz" data-nav="quiz">퀴즈</a>
    <a href="#/company" data-nav="company">기업 분석 기초</a>
    <a href="#/risk" data-nav="risk">위험 관리</a>
    <a href="#/stats" data-nav="stats">검증·통계</a>
    <a href="#/explore" data-nav="explore">종목 탐구 <small>준비 중</small></a>
    <a href="#/me" data-nav="me">내 학습</a>
    <a href="#/sources" data-nav="sources">데이터·출처</a>
  </nav>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" aria-label="하단 메뉴">
    <a href="#/" data-nav="home"><span class="ti ti-home" aria-hidden="true"></span>홈</a>
    <a href="#/terms" data-nav="terms"><span class="ti ti-book" aria-hidden="true"></span>용어</a>
    <a href="#/patterns" data-nav="patterns"><span class="ti ti-chart" aria-hidden="true"></span>도감</a>
    <a href="#/practice" data-nav="practice"><span class="ti ti-target" aria-hidden="true"></span>연습실</a>
    <a href="#/more" data-nav="more"><span class="ti ti-more" aria-hidden="true"></span>더보기</a>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
